<!DOCTYPE html>
<html>
<head>
    <title>Calculate Grade</title>
</head>
<body>

<h2>Calculate Grade</h2>

<label>Enter Amount:</label>
<input type="number" id="score">
<button onclick="calculateGrade()">Submit</button>

<p id="result"></p>

<script>
function calculateGrade() {

    let score = document.getElementById("score").value;
    let grade = "";

    if (score >= 80 && score <= 100) {
        grade = "You got an A";
    }
    else if (score >= 70) {
        grade = "You got a B";
    }
    else if (score >= 60) {
        grade = "You got a C";
    }
    else if (score >= 50) {
        grade = "You got a D";
    }
    else if (score >= 0) {
        grade = "You got an F";
    }
    else {
        grade = "Invalid Score";
    }

    document.getElementById("result").innerHTML = grade;
}
</script>

</body>
</html>
